# Tests the widget on every pull request; on main, deploys it to cdn.accesspilot.org only after the tests pass.
name: Widget

on:
  pull_request:
    paths:
      - "apps/widget/**"
      - "packages/tokens/**"
      - "packages/widget-config/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/widget.yml"
  push:
    branches: [main]
    paths:
      - "apps/widget/**"
      - "packages/tokens/**"
      - "packages/widget-config/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/widget.yml"
  workflow_dispatch: # "Run workflow" button, to redeploy by hand

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1 # same as devEngines in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter widget typecheck
      - name: Config contract tests
        run: pnpm --filter @app/widget-config test
      - name: Color contrast of the tokens
        run: pnpm --filter @app/tokens test
      - name: Install the browser for Playwright
        run: pnpm --filter widget exec playwright install --with-deps chromium
      - name: Widget tests (Playwright + axe)
        run: pnpm --filter widget test

      - name: Keep the trace of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/widget/test-results/
          retention-days: 7

  deploy:
    needs: test # a failed test means no deploy: customers keep the last good version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: widget-deploy
      cancel-in-progress: false # never stop a deploy halfway; the next one waits its turn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A clean build: the test job's dist also held the test pages, which must never reach the CDN.
      - name: Build
        run: pnpm --filter widget build
        env:
          WIDGET_API_BASE: https://manage.accesspilot.org
      - name: Check the build points at production
        run: |
          grep -q "https://manage.accesspilot.org" apps/widget/dist/app.*.js
          test -f apps/widget/dist/_headers
          test ! -e apps/widget/dist/index.html

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4 pages deploy apps/widget/dist --project-name accesspilot-widget --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
