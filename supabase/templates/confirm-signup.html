<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Confirm your AccessPilot account</title></head>
<body style="margin:0;padding:24px;background:#f7f6fc;font-family:Arial,Helvetica,sans-serif;color:#1c1a33;font-size:16px;line-height:1.5">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #dedbee;border-radius:16px;padding:32px">
    <p style="margin:0 0 24px;font-weight:bold;font-size:18px">AccessPilot</p>
    <h1 style="margin:0 0 12px;font-size:24px">Confirm your email</h1>
    <p style="margin:0 0 24px">Open this link to finish creating your AccessPilot account. It works for one hour.</p>
    <p style="margin:0 0 24px">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;redirect_to={{ .RedirectTo }}"
         style="display:inline-block;background:#1c1a33;color:#ffffff;text-decoration:none;font-weight:bold;padding:14px 22px;border-radius:12px">Confirm my email</a>
    </p>
    <p style="margin:0;color:#5b6475;font-size:14px">Didn’t sign up? You can ignore this email: no account is made until the link is opened.</p>
  </div>
</body>
</html>
